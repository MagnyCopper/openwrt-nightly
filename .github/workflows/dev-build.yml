name: Dev Build

on:
  push:
    branches:
      - dev
    paths:
      - 'profiles/**'
      - 'configs/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Device profile to build'
        required: false
        type: string
        default: 'r2s'

jobs:
  build:
    name: Dev Build (${{ inputs.profile || 'r2s' }})
    uses: ./.github/workflows/build.yml
    permissions:
      actions: write
    with:
      profile: ${{ inputs.profile || 'r2s' }}
    secrets: inherit
