name: Dev Build

on:
  push:
    branches:
      - dev
    paths:
      - 'profiles/**'
      - 'configs/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Device profile to build'
        required: false
        type: string
        default: 'r2s'
      source_repo_url:
        description: 'Git repository URL'
        required: false
        type: string
        default: 'https://github.com/immortalwrt/immortalwrt.git'
      source_branch:
        description: 'Git branch or tag'
        required: false
        type: string
        default: 'openwrt-24.10'
      source_name:
        description: 'Source display name'
        required: false
        type: string
        default: 'immortalwrt'

# 同一分支的新 push 自动取消未完成的旧构建，避免重复 runner 占用与
# dl/ccache 缓存并发回写（last-write-wins）。参考 GitHub Actions 官方 concurrency 文档。
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Dev Build (${{ inputs.profile || 'r2s' }})
    uses: ./.github/workflows/build.yml
    permissions:
      actions: write
    with:
      profile: ${{ inputs.profile || 'r2s' }}
      source_repo_url: ${{ inputs.source_repo_url || 'https://github.com/immortalwrt/immortalwrt.git' }}
      source_branch: ${{ inputs.source_branch || 'openwrt-24.10' }}
      source_name: ${{ inputs.source_name || 'immortalwrt' }}
    secrets: inherit
