name: Dev Build

on:
  push:
    branches:
      - dev
    paths:
      - 'profiles/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Device profile to build'
        required: false
        type: string
        default: 'r2s'
      ssh_debug:
        description: 'Enable SSH debugging'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Dev Build (${{ inputs.profile || 'r2s' }})
    uses: ./.github/workflows/build.yml
    with:
      profile: ${{ inputs.profile || 'r2s' }}
      publish: false
      ssh_debug: ${{ inputs.ssh_debug || false }}
    secrets: inherit
