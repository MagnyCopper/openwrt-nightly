name: Biweekly Build

on:
  schedule:
    # Every 2 weeks, Sunday at 04:00 HKT (Saturday 20:00 UTC)
    - cron: '0 20 1,15 * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Device profile to build'
        required: false
        type: string
        default: 'r2s'

jobs:
  build:
    name: Biweekly Build (${{ inputs.profile || 'r2s' }})
    uses: ./.github/workflows/build.yml
    permissions:
      actions: write
    with:
      profile: ${{ inputs.profile || 'r2s' }}
    secrets: inherit
