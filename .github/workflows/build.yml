name: Build OpenWrt Firmware

on:
  workflow_call:
    inputs:
      profile:
        description: 'Device profile name (e.g., r2s)'
        required: true
        type: string
      source_repo_url:
        description: 'Git repository URL'
        required: false
        type: string
        default: 'https://github.com/immortalwrt/immortalwrt.git'
      source_branch:
        description: 'Git branch or tag'
        required: false
        type: string
        default: 'openwrt-24.10'
      source_name:
        description: 'Source display name'
        required: false
        type: string
        default: 'immortalwrt'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ inputs.profile }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write

    steps:
      # ── Phase 1: Checkout & Environment ──────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          BUILD_DATE=$(date +"%Y.%m.%d")
          ARTIFACT_NAME="${{ inputs.source_name }}-${{ inputs.profile }}-${BUILD_DATE}"

          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "SOURCE_REPO_URL=${{ inputs.source_repo_url }}" >> "$GITHUB_ENV"
          echo "SOURCE_REPO_BRANCH=${{ inputs.source_branch }}" >> "$GITHUB_ENV"
          echo "SOURCE_NAME=${{ inputs.source_name }}" >> "$GITHUB_ENV"
          echo "PROFILE=${{ inputs.profile }}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -hT /

      - name: Install build dependencies
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir

      # ── Phase 2: Clone Source ────────────────────────────────────
      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch \
            -b "${SOURCE_REPO_BRANCH}" "${SOURCE_REPO_URL}" openwrt

      # ── Phase 3: Restore Cache (AFTER clone, safe) ──────────────
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-${{ inputs.profile }}-${{ inputs.source_branch }}
          restore-keys: |
            dl-${{ inputs.profile }}-${{ inputs.source_branch }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/.ccache
          key: ccache-${{ inputs.profile }}-${{ inputs.source_branch }}-${{ hashFiles(format('profiles/{0}/config', inputs.profile)) }}
          restore-keys: |
            ccache-${{ inputs.profile }}-${{ inputs.source_branch }}-

      # ── Phase 4: Feeds ────────────────────────────────────────
      - name: Setup third-party feeds (ddnsto)
        working-directory: /workdir/openwrt
        run: |
          # DDNSTo (linkease/nas-packages) — not bundled in ImmortalWrt feeds
          echo "src-git ddnsto https://github.com/linkease/nas-packages.git" >> feeds.conf.default
          echo "src-git ddnsto_luci https://github.com/linkease/nas-packages-luci.git" >> feeds.conf.default
      - name: Update & install feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ── Phase 5: Configuration ──────────────────────────────────
      - name: Load device configuration
        working-directory: /workdir/openwrt
        run: |
          PROFILE="${{ inputs.profile }}"
          # Copy custom files overlay (including dotfiles)
          if [ -d "${GITHUB_WORKSPACE}/profiles/${PROFILE}/files" ]; then
            cp -a "${GITHUB_WORKSPACE}/profiles/${PROFILE}/files/." .
          fi
          # Device-specific config as base
          cp "${GITHUB_WORKSPACE}/profiles/${PROFILE}/config" .config
          # Merge shared packages for this firmware source (skip comments and blank lines)
          PACKAGES_CONF="${GITHUB_WORKSPACE}/configs/${SOURCE_NAME}/packages.conf"
          if [ ! -f "${PACKAGES_CONF}" ]; then
            echo "::error::No packages.conf for source '${SOURCE_NAME}' (expected ${PACKAGES_CONF})"
            exit 1
          fi
          grep -v '^\s*#' "${PACKAGES_CONF}" | grep -v '^\s*$' >> .config

      # ── Phase 6: Build ──────────────────────────────────────────
      - name: Download sources
        working-directory: /workdir/openwrt
        run: |
          make defconfig
          make download -j$(nproc)
          # Only clean up suspiciously small archive files (failed downloads),
          # NOT Go module source files which can legitimately be tiny
          find dl -maxdepth 2 -size -1024c -type f \( -name "*.tar.*" -o -name "*.zip" -o -name "*.gz" -o -name "*.tgz" \) -exec ls -l {} \;
          find dl -maxdepth 2 -size -1024c -type f \( -name "*.tar.*" -o -name "*.zip" -o -name "*.gz" -o -name "*.tgz" \) -exec rm -f {} \;

      - name: Compile firmware
        working-directory: /workdir/openwrt
        env:
          CCACHE_DIR: /workdir/openwrt/.ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          echo "::group::Parallel build ($(nproc) threads)"
          make -j$(nproc) || {
            echo "::endgroup::"
            echo "::group::Single thread retry"
            make -j1 || {
              echo "::endgroup::"
              echo "::group::Verbose single thread retry"
              make -j1 V=s
              echo "::endgroup::"
            }
          }
          echo "::endgroup::"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          echo "DEVICE_NAME=_$(cat DEVICE_NAME 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"

      # ── Phase 7: Collect & Publish ──────────────────────────────
      - name: Collect firmware
        if: ${{ success() }}
        working-directory: /workdir/openwrt
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/firmware"
          # Firmware images
          find bin/targets -type f \( -name "*.img.gz" -o -name "*.img" -o -name "*.bin" -o -name "*.itb" \) \
            -exec cp {} "${GITHUB_WORKSPACE}/firmware/" \;
          find bin/targets -name "sha256sums" -exec cp {} "${GITHUB_WORKSPACE}/firmware/" \;
          # Build metadata for auditability
          test -f .config && cp .config "${GITHUB_WORKSPACE}/firmware/config.buildinfo"
          find bin/targets -name "manifest" -exec cp {} "${GITHUB_WORKSPACE}/firmware/manifest" \;
          find bin/targets -name "*.buildinfo" -exec cp {} "${GITHUB_WORKSPACE}/firmware/" \;
          echo "FIRMWARE_DIR=${GITHUB_WORKSPACE}/firmware" >> "$GITHUB_ENV"
          ls -lh "${GITHUB_WORKSPACE}/firmware/"

      - name: Upload firmware artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.FIRMWARE_DIR }}/*
          retention-days: 14

      # ── Phase 8: Cleanup ─────────────────────────────────────────
      - name: Prune old workflow runs
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP_RUNS=5
          gh run list --workflow build.yml --limit 100 --status completed --json databaseId --jq '.[].databaseId' | \
            tail -n +$((KEEP_RUNS+1)) | \
            while read -r RUN_ID; do
              gh run delete "$RUN_ID" || true
            done

      - name: Disk usage
        if: ${{ !cancelled() }}
        run: df -hT
