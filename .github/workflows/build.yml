name: Build OpenWrt Firmware

on:
  workflow_call:
    inputs:
      profile:
        description: 'Device profile name (e.g., r2s)'
        required: true
        type: string
      source_repo_url:
        description: 'Git repository URL'
        required: false
        type: string
        default: 'https://github.com/immortalwrt/immortalwrt.git'
      source_branch:
        description: 'Git branch or tag'
        required: false
        type: string
        default: 'openwrt-24.10'
      source_name:
        description: 'Source display name'
        required: false
        type: string
        default: 'immortalwrt'
      publish:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: false
      ssh_debug:
        description: 'Enable SSH debugging via tmate'
        required: false
        type: boolean
        default: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ inputs.profile }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ── Phase 1: Checkout & Environment ──────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          BUILD_DATE=$(date +"%Y.%m.%d")
          BUILD_TIMESTAMP=$(date +"%Y%m%d%H%M")
          ARTIFACT_NAME="${{ inputs.source_name }}-${{ inputs.profile }}-${BUILD_DATE}"
          RELEASE_TAG="v${BUILD_DATE}-${BUILD_TIMESTAMP}"

          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "SOURCE_REPO_URL=${{ inputs.source_repo_url }}" >> "$GITHUB_ENV"
          echo "SOURCE_REPO_BRANCH=${{ inputs.source_branch }}" >> "$GITHUB_ENV"
          echo "SOURCE_NAME=${{ inputs.source_name }}" >> "$GITHUB_ENV"
          echo "PROFILE=${{ inputs.profile }}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -hT /

      - name: Install build dependencies
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir

      # ── Phase 2: Clone Source ────────────────────────────────────
      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch \
            -b "${SOURCE_REPO_BRANCH}" "${SOURCE_REPO_URL}" openwrt

      # ── Phase 3: Restore Cache (AFTER clone, safe) ──────────────
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-${{ inputs.profile }}-${{ inputs.source_branch }}
          restore-keys: |
            dl-${{ inputs.profile }}-${{ inputs.source_branch }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/.ccache
          key: ccache-${{ inputs.profile }}-${{ inputs.source_branch }}-${{ hashFiles(format('profiles/{0}/config', inputs.profile)) }}
          restore-keys: |
            ccache-${{ inputs.profile }}-${{ inputs.source_branch }}-

      # ── Phase 4: Feeds & Third-party Packages ────────────────────
      - name: Setup third-party feeds
        working-directory: /workdir/openwrt
        run: |
          PROFILE="${{ inputs.profile }}"
          HOOK="${GITHUB_WORKSPACE}/profiles/${PROFILE}/hooks/pre-build.sh"
          if [ -f "$HOOK" ]; then
            chmod +x "$HOOK"
            source "$HOOK"
          fi

      - name: Update & install feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a

          # Override golang toolchain if flagged by pre-build hook (e.g., mosdns needs Go 1.24+)
          if [ -f /tmp/.golang-override ] && [ -d feeds/packages/lang/golang ]; then
            rm -rf feeds/packages/lang/golang
            git clone --depth=1 -b 25.x https://github.com/sbwml/packages_lang_golang.git feeds/packages/lang/golang
            echo "Overrode golang toolchain with sbwml 25.x (Go 1.25+)"
          fi

          ./scripts/feeds install -a -f

      # ── Phase 5: Configuration ──────────────────────────────────
      - name: Load device configuration
        working-directory: /workdir/openwrt
        run: |
          PROFILE="${{ inputs.profile }}"
          # Copy custom files overlay
          if [ -d "${GITHUB_WORKSPACE}/profiles/${PROFILE}/files" ]; then
            cp -r "${GITHUB_WORKSPACE}/profiles/${PROFILE}/files/"* . 2>/dev/null || true
          fi
          # Device-specific config as base
          cp "${GITHUB_WORKSPACE}/profiles/${PROFILE}/config" .config
          # Merge shared packages (skip comments and blank lines)
          grep -v '^\s*#' "${GITHUB_WORKSPACE}/configs/packages.conf" | grep -v '^\s*$' >> .config

      # ── Phase 6: SSH Debug ──────────────────────────────────────
      - name: SSH debug
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.ssh_debug }}
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

      # ── Phase 7: Build ──────────────────────────────────────────
      - name: Download sources
        working-directory: /workdir/openwrt
        run: |
          make defconfig
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: /workdir/openwrt
        run: |
          echo "::group::Parallel build ($(nproc) threads)"
          make -j$(nproc) || {
            echo "::endgroup::"
            echo "::group::Single thread retry"
            make -j1 || {
              echo "::endgroup::"
              echo "::group::Verbose single thread retry"
              make -j1 V=s
              echo "::endgroup::"
            }
          }
          echo "::endgroup::"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          echo "DEVICE_NAME=_$(cat DEVICE_NAME 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"

      # ── Phase 8: Collect & Publish ──────────────────────────────
      - name: Collect firmware
        if: ${{ success() }}
        working-directory: /workdir/openwrt
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/firmware"
          find bin/targets -type f \( -name "*.img.gz" -o -name "*.img" -o -name "*.bin" -o -name "*.itb" \) \
            -exec cp {} "${GITHUB_WORKSPACE}/firmware/" \;
          find bin/targets -name "sha256sums" -exec cp {} "${GITHUB_WORKSPACE}/firmware/" \;
          echo "FIRMWARE_DIR=${GITHUB_WORKSPACE}/firmware" >> "$GITHUB_ENV"
          ls -lh "${GITHUB_WORKSPACE}/firmware/"

      - name: Upload firmware artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.FIRMWARE_DIR }}/*
          retention-days: 14

      - name: Generate release body
        if: ${{ success() && inputs.publish }}
        run: |
          cat > release-body.md <<EOF
          ## ${SOURCE_NAME} Firmware for ${{ inputs.profile }}

          | Item | Value |
          |------|-------|
          | Source | ${SOURCE_NAME} |
          | Branch/Tag | ${SOURCE_REPO_BRANCH} |
          | Device | ${{ inputs.profile }} |
          | Build Date | ${BUILD_DATE} |
          | Target | rockchip/armv8 |

          ### Flash Instructions
          1. Download the \`.img.gz\` file
          2. Decompress to get \`.img\`
          3. Flash to SD card using balenaEtcher or \`dd\`
          4. Insert SD card into device and power on

          ### Default Access
          - Address: http://192.168.1.1 or http://immortalwrt.lan
          - Username: root
          - Password: *(none)*
          EOF

      - name: Publish to GitHub Releases
        if: ${{ success() && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.SOURCE_NAME }} ${{ inputs.profile }} (${{ env.BUILD_DATE }})"
          body_path: release-body.md
          files: ${{ env.FIRMWARE_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old releases
        if: ${{ success() && inputs.publish }}
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Phase 9: Cleanup ────────────────────────────────────────
      - name: Prune old workflow runs
        if: ${{ !cancelled() }}
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 5

      - name: Disk usage
        if: ${{ !cancelled() }}
        run: df -hT
