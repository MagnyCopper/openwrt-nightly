name: Biweekly Build

on:
  schedule:
    # Twice monthly: 1st & 15th, 04:00 HKT (20:00 UTC prior day)
    - cron: '0 20 1,15 * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Device profile to build'
        required: false
        type: string
        default: 'r2s'
      source_repo_url:
        description: 'Git repository URL'
        required: false
        type: string
        default: 'https://github.com/immortalwrt/immortalwrt.git'
      source_branch:
        description: 'Git branch or tag'
        required: false
        type: string
        default: 'openwrt-24.10'
      source_name:
        description: 'Source display name'
        required: false
        type: string
        default: 'immortalwrt'

jobs:
  build:
    name: Biweekly Build (${{ inputs.profile || 'r2s' }})
    uses: ./.github/workflows/build.yml
    permissions:
      actions: write
    with:
      profile: ${{ inputs.profile || 'r2s' }}
      source_repo_url: ${{ inputs.source_repo_url || 'https://github.com/immortalwrt/immortalwrt.git' }}
      source_branch: ${{ inputs.source_branch || 'openwrt-24.10' }}
      source_name: ${{ inputs.source_name || 'immortalwrt' }}
    secrets: inherit
