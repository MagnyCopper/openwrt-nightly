#
# Shared packages for ImmortalWrt builds
#
# Cross-device:  all devices under the ImmortalWrt source share this list.
# Firmware-specific: this file is for ImmortalWrt only.
#   Other firmware sources get their own configs/<source_name>/packages.conf,
#   and build.yml reads configs/${SOURCE_NAME}/packages.conf accordingly.
# Device-specific packages (e.g., kmod-usb-net-rtl8152 for R2S)
# belong in profiles/<device>/config, NOT here.
#
# Editing this file is how you add/remove plugins for ALL ImmortalWrt devices.
# ImmortalWrt's own default packages (base-files, dnsmasq-full, firewall4,
# luci, etc.) are auto-included by `make defconfig` — do not duplicate them.
#

# ==========================================
# Proxy
# ==========================================
CONFIG_PACKAGE_luci-app-openclash=y

# ==========================================
# DNS
# ==========================================
CONFIG_PACKAGE_luci-app-smartdns=y
CONFIG_PACKAGE_luci-app-adblock=y

# ==========================================
# System Management
# ==========================================
CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-app-ramfree=y
CONFIG_PACKAGE_luci-app-watchcat=y
CONFIG_PACKAGE_luci-app-autoreboot=y

# ==========================================
# Monitoring
# ==========================================
CONFIG_PACKAGE_luci-app-netdata=y
CONFIG_PACKAGE_luci-app-nlbwmon=y

# ==========================================
# Network
# ==========================================
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_luci-app-irqbalance=y
CONFIG_PACKAGE_luci-app-arpbind=y
CONFIG_PACKAGE_luci-app-sqm=y
CONFIG_PACKAGE_luci-app-appfilter=y

# ==========================================
# Remote Access
# ==========================================
CONFIG_PACKAGE_luci-app-zerotier=y
CONFIG_PACKAGE_luci-app-nps=y
CONFIG_PACKAGE_luci-app-wol=y

# ==========================================
# Notifications
# ==========================================
CONFIG_PACKAGE_luci-app-wechatpush=y

# ==========================================
# LuCI Theme
# ==========================================
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-argon-config=y

# ==========================================
# CLI Tools
# ==========================================
CONFIG_PACKAGE_bash=y
CONFIG_PACKAGE_nano=y
CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_mtr-nojson=y
CONFIG_PACKAGE_tcpdump=y
CONFIG_PACKAGE_iperf3=y
