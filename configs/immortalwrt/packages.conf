#
# Shared packages for ImmortalWrt builds
#
# Cross-device:  all devices under the ImmortalWrt source share this list.
# Firmware-specific: this file is for ImmortalWrt only.
#   Other firmware sources get their own configs/<source_name>/packages.conf,
#   and build.yml reads configs/${SOURCE_NAME}/packages.conf accordingly.
# Device-specific packages (e.g., kmod-usb-net-rtl8152 for R2S)
# belong in profiles/<device>/config, NOT here.
#
# Editing this file is how you add/remove plugins for ALL ImmortalWrt devices.
# Base-image mode: only UNCOMMENTED lines are built into the firmware.
#   Commented lines are staged plugins — verify on a test router first, then
#   uncomment the line and push to dev to enable it in the next build.
# ImmortalWrt's own default packages (base-files, dnsmasq-full, firewall4,
# ImmortalWrt's own default packages (base-files, dnsmasq-full, firewall4,
# luci, etc.) are auto-included by `make defconfig` — do not duplicate them.
#

# ==========================================
# Proxy
# ==========================================
CONFIG_PACKAGE_luci-app-openclash=y

# ==========================================
# DNS
# ==========================================
# CONFIG_PACKAGE_luci-app-smartdns=y  # staged: DNS 加速,待试验田验证
# CONFIG_PACKAGE_luci-app-adblock=y  # staged: DNS 去广告,与 openclash reject 规则重叠,待验证

# ==========================================
# System Management
# ==========================================
# CONFIG_PACKAGE_luci-app-attendedsysupgrade=y  # staged: 仅适用官方 ASU 服务器,自编译固件用不上
# CONFIG_PACKAGE_luci-app-ttyd=y  # staged: 已有 SSH,按需启用
# CONFIG_PACKAGE_luci-app-ramfree=y  # staged: Linux 内存管理自足,收益存疑
# CONFIG_PACKAGE_luci-app-watchcat=y  # staged: 日志实证 5 天零重启,待验证
# CONFIG_PACKAGE_luci-app-autoreboot=y  # staged: 与 watchcat 重叠,待验证

# ==========================================
# Monitoring
# ==========================================
# CONFIG_PACKAGE_luci-app-netdata=y  # staged: 实时监控,待验证
# CONFIG_PACKAGE_luci-app-nlbwmon=y  # staged: 流量记账,待验证

# ==========================================
# Network
# ==========================================
# CONFIG_PACKAGE_luci-app-upnp=y  # staged: 日志显示仅失效订阅刷屏,场景存疑
# CONFIG_PACKAGE_luci-app-irqbalance=y  # staged: 双核收益边际,待验证
# CONFIG_PACKAGE_luci-app-arpbind=y  # staged: 内网无 ARP 欺骗史,待验证
# CONFIG_PACKAGE_luci-app-sqm=y  # staged: R2S 跑不动千兆 cake,低带宽才考虑
# CONFIG_PACKAGE_luci-app-appfilter=y  # staged: 家庭管控场景,待验证

# ==========================================
# Remote Access
# ==========================================
# CONFIG_PACKAGE_luci-app-zerotier=y  # staged: 大陆裸连不稳,待验证
# CONFIG_PACKAGE_luci-app-nps=y  # staged: 需自备 VPS,待验证
# CONFIG_PACKAGE_ddnsto=y  # staged: 改用 koolcenter 脚本按需安装,feed 保留供未来启用
# CONFIG_PACKAGE_luci-app-ddnsto=y  # staged: 同上
# CONFIG_PACKAGE_luci-app-wol=y  # staged: 无远程开机需求,待验证

# ==========================================
# Notifications
# ==========================================
# CONFIG_PACKAGE_luci-app-wechatpush=y  # staged: 通知推送,待验证

# ==========================================
# LuCI Theme
# ==========================================
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-argon-config=y
CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y

