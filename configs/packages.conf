#
# Shared packages for ImmortalWrt builds
# All devices under the same source share this package list.
# Device-specific packages (e.g., kmod-usb-net-rtl8152 for R2S)
# should go in profiles/<device>/config
#

#
# LuCI Web Interface
#
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-light=y
CONFIG_PACKAGE_luci-ssl-openssl=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-lib-base=y
CONFIG_PACKAGE_luci-lib-ipkg=y
CONFIG_PACKAGE_luci-app-package-manager=y

#
# Base System
#
CONFIG_PACKAGE_default-settings-chn=y
CONFIG_PACKAGE_dnsmasq-full=y
CONFIG_PACKAGE_autocore=y
CONFIG_PACKAGE_automount=y

#
# VPN & Proxy
#
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_tailscale=y

#
# Utilities
#
CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_wget-ssl=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_iperf3=y
CONFIG_PACKAGE_tcpdump=y

#
# LuCI Apps
#
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-app-cpufreq=y

# ==========================================
# Add your plugins below
# ==========================================

