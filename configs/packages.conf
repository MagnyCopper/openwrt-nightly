#
# Shared packages for ImmortalWrt builds
# All devices under the same source share this package list.
# Device-specific packages (e.g., kmod-usb-net-rtl8152 for R2S)
# should go in profiles/<device>/config
#
# NOTE: ImmortalWrt default packages (listed below) are auto-included
# by `make defconfig`, no need to add them here:
#
#   autocore              - System info display in LuCI
#   automount             - Auto-mount USB/NVMe storage
#   base-files            - Essential system files
#   block-mount           - Block device mount support
#   ca-bundle             - SSL root certificates
#   default-settings-chn  - China region defaults (DNS, timezone)
#   dnsmasq-full          - Full-featured DNS/DHCP server
#   dropbear              - Lightweight SSH server
#   fdisk                 - Disk partition tool
#   firewall4             - Firewall framework (nftables-based)
#   fstools               - Filesystem utilities
#   kmod-gpio-button-hotplug - GPIO button support
#   kmod-nf-nathelper     - NAT helper (FTP/PPTP/SIP etc.)
#   kmod-nf-nathelper-extra - Extra NAT helpers
#   kmod-nft-offload      - Hardware flow offloading
#   libc / libgcc         - C runtime libraries
#   libustream-openssl    - HTTPS/stream support (OpenSSL)
#   logd                  - System logging daemon
#   luci-app-cpufreq      - CPU frequency tuning (LuCI)
#   luci-app-package-manager - Package manager in LuCI (replaces opkg/luci-app-opkg)
#   luci-compat           - LuCI backward compatibility (required by OpenClash etc.)
#   luci-lib-base         - LuCI base library
#   luci-lib-ipkg         - LuCI package library
#   luci-light            - Lightweight LuCI web interface (Bootstrap theme)
#   mkf2fs                - F2FS filesystem tool
#   mtd                   - Flash memory tool
#   netifd                - Network interface daemon
#   nftables              - Packet filtering (replaces iptables)
#   odhcp6c               - IPv6 DHCPv6 client
#   odhcpd-ipv6only       - IPv6 DHCP/RA server
#   opkg                  - Package manager CLI
#   partx-utils           - Partition table tools
#   ppp / ppp-mod-pppoe   - PPPoE dial-up support
#   procd-ujail           - Process isolation (security)
#   uboot-envtools        - U-Boot environment tools
#   uci                   - Unified Configuration Interface
#   uclient-fetch         - Lightweight HTTP/HTTPS download tool
#   urandom-seed          - Random seed generator
#   urngd                 - Hardware random number generator
#
# Reference: ImmortalWrt v24.10.5 profiles.json for rockchip/armv8
#

# ==========================================
# Extra packages (beyond ImmortalWrt defaults)
# ==========================================

#
# LuCI Web Interface - extras
#
CONFIG_PACKAGE_luci-ssl-openssl=y

#
# VPN & Proxy
#
CONFIG_PACKAGE_luci-app-openclash=y
#   OpenClash - 科学上网代理客户端 (支持 Clash/Clash.Meta 内核)
CONFIG_PACKAGE_tailscale=y
#   Tailscale - 基于 WireGuard 的零配置组网 VPN

#
# Utilities
#
CONFIG_PACKAGE_htop=y
#   htop - 交互式进程查看器 (比 top 更直观)
CONFIG_PACKAGE_wget-ssl=y
#   wget-ssl - 支持 HTTPS 的下载工具
CONFIG_PACKAGE_curl=y
#   curl - URL 数据传输工具 (API 调用、下载脚本等)
CONFIG_PACKAGE_iperf3=y
#   iperf3 - 网络带宽性能测试工具
CONFIG_PACKAGE_tcpdump=y
#   tcpdump - 网络抓包分析工具

#
# LuCI Apps - extras
#
CONFIG_PACKAGE_luci-app-ttyd=y
#   ttyd - Web 终端 (浏览器直接 SSH 访问路由器)

# ==========================================
# Uncomment to enable more plugins
# ==========================================

# CONFIG_PACKAGE_luci-app-adguardhome=y
#   AdGuard Home - 网络级广告过滤 & DNS 服务器

# CONFIG_PACKAGE_luci-app-upnp=y
#   UPnP - 自动端口映射 (P2P下载、游戏主机需要)

# CONFIG_PACKAGE_luci-app-mosdns=y
#   MosDNS - DNS 分流插件 (配合 OpenClash 使用)

# CONFIG_PACKAGE_luci-app-ddns-go=y
#   DDNS-Go - 动态域名解析 (公网IP变化时自动更新域名)

# CONFIG_PACKAGE_luci-app-wol=y
#   WOL - 网络唤醒 (远程开机)

# CONFIG_PACKAGE_luci-app-samba4=y
#   Samba4 - 局域网文件共享 (路由器挂载硬盘共享)

# CONFIG_PACKAGE_luci-app-frps=y
#   FRP Server - 内网穿透服务端

# CONFIG_PACKAGE_luci-app-frpc=y
#   FRP Client - 内网穿透客户端

# CONFIG_PACKAGE_luci-app-wechatpush=y
#   WeChatPush - 微信/钉钉推送 (设备上线、流量异常通知)

# CONFIG_PACKAGE_luci-app-zerotier=y
#   ZeroTier - 另一个 P2P 组网方案 (替代 Tailscale)
