# R2S 内核网络调优（参照 unifreq/openwrt_packit 社区实战值，1GB RAM 实测量身）
# 连接跟踪表：默认 65535/16384 → 32万（高并发代理/P2P 不断流，懒分配不预占内存）
net.netfilter.nf_conntrack_max = 327680
net.netfilter.nf_conntrack_buckets = 81920
# 软中断处理配额翻倍（默认 300/2000us，突发流量不丢包）
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 16000
net.core.dev_weight = 128
# TCP 缓冲区（长肥管道/代理多连接，默认 4MB/1MB 太小）
net.core.rmem_default = 16277216
net.core.wmem_default = 16277216
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 10240 87380 33554432
net.ipv4.tcp_wmem = 10240 87380 33554432
net.ipv4.tcp_max_syn_backlog = 1024
net.core.netdev_max_backlog = 9000
# TCP Fast Open（客户端+服务端）
net.ipv4.tcp_fastopen = 3
# RFS 流表（配合 rps-tune 服务，按流亲和分发收包）
net.rps_sock_flow_entries = 32768
# 系统最少保留内存（默认 16384，防 OOM 杀代理进程）
vm.min_free_kbytes = 32768
